[program:operator-realtime]
; Operator Realtime Server - WebSocket daemon for KPI broadcasts
;
; Installation:
;   1. Copy this file to /etc/supervisor/conf.d/operator-realtime.conf
;   2. sudo supervisorctl reread
;   3. sudo supervisorctl add operator-realtime
;   4. sudo supervisorctl start operator-realtime
;
; Check status:
;   sudo supervisorctl status operator-realtime
;
; View logs:
;   tail -f /var/log/supervisor/operator-realtime.log
;

; Program executable and arguments
command=/opt/homebrew/bin/php %(ENV_APP_ROOT)s/bin/operator-realtime-server --port=8001 --host=127.0.0.1
directory=%(ENV_APP_ROOT)s
user=www-data
autostart=true
autorestart=true
startsecs=10
stopasgroup=true

; Logging configuration
stdout_logfile=/var/log/supervisor/operator-realtime.log
stderr_logfile=/var/log/supervisor/operator-realtime-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_backups=10

; Process resource limits
environment=APP_ROOT="%(ENV_APP_ROOT)s"
numprocs=1
priority=999

; Restart policy
stopsignal=TERM
stopwaitsecs=10
